# 本地 / 测试环境：H2 文件库 + 自动建表（开发效率）
spring:
  datasource:
    url: jdbc:h2:file:./data/shuziyili;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

shuziyili:
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "https://shuziyili.com"
      - "https://www.shuziyili.com"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
