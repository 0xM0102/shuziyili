# 本地开发：与生产一致使用 MySQL + Flyway（避免 H2 / MySQL 两套行为）
# 库名默认 shuziyili。JDBC 已带 createDatabaseIfNotExist=true：首次连库时若库不存在会自动创建（仅开发默认 URL；生产请显式建库）。
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/shuziyili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

shuziyili:
  cors:
    allowed-origin-patterns:
      # Vite 管理后台默认端口；与通配一并列出，避免部分环境下 localhost:* 匹配异常
      - "http://localhost:5174"
      - "http://127.0.0.1:5174"
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "https://shuziyili.com"
      - "https://www.shuziyili.com"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
