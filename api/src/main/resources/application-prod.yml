# 生产环境：MySQL + Flyway 基线迁移，禁止自动改表结构
# 启动示例：
#   SPRING_PROFILES_ACTIVE=prod \
#   SPRING_DATASOURCE_URL=jdbc:mysql://127.0.0.1:3306/shuziyili?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai \
#   SPRING_DATASOURCE_USERNAME=... SPRING_DATASOURCE_PASSWORD=... \
#   java -jar shuziyili-api.jar

management:
  endpoint:
    health:
      show-details: never

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

# 逗号分隔；未设置时默认主站域名（仍建议部署时显式配置）
shuziyili:
  cors:
    allowed-origin-patterns-csv: ${CORS_ALLOWED_ORIGINS:https://www.shuziyili.com,https://shuziyili.com}

# 生产关闭接口文档外放（减少攻击面）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
