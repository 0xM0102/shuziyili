spring:
  application:
    name: shuziyili-api
  profiles:
    default: dev
    # 上线标准：本机开发希望“启动就自动连 COS”，但又不影响生产。
    # 用 profile group 把 dev 自动扩展为 dev + local（local 从 application-local.yml 读取，且已 gitignore）。
    group:
      dev: dev,local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

# 上线标准：健康检查（K8s / 负载均衡探针）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# CORS：生产请在 application-prod 或环境变量 CORS_ALLOWED_ORIGINS 中收紧
shuziyili:
  cors:
    allowed-origin-patterns-csv: ${CORS_ALLOWED_ORIGINS:}
  # 腾讯云 COS（密钥务必用环境变量，勿提交仓库）
  # 短信：默认仅日志（LogSmsSender）。真实发送见 TencentSmsSender，模版文案见 api/docs/sms-templates.md
  sms:
    enabled: ${SHUZIYILI_SMS_ENABLED:false}
    secret-id: ${SHUZIYILI_SMS_SECRET_ID:}
    secret-key: ${SHUZIYILI_SMS_SECRET_KEY:}
    sdk-app-id: ${SHUZIYILI_SMS_SDK_APP_ID:1401102717}
    sign-name: ${SHUZIYILI_SMS_SIGN_NAME:干撒深圳信息科技}
    template-login-id: ${SHUZIYILI_SMS_TEMPLATE_LOGIN:}
    template-register-id: ${SHUZIYILI_SMS_TEMPLATE_REGISTER:}
    region: ${SHUZIYILI_SMS_REGION:ap-guangzhou}

  # 是否在 sms_codes.plain_code 写入验证码明文（管理后台可见）。生产务必 false：SHUZIYILI_STORE_PLAIN_OTP=false
  auth:
    store-plain-otp: ${SHUZIYILI_STORE_PLAIN_OTP:true}

  # ---------------------------------------------------------------------------
  # 门户资讯 + 天气（默认聚合 Juhe；备选 tianapi / tencent 见下方注释）
  # 本地 application-local.yml、生产 api.env 与下列默认值保持一致。
  # ---------------------------------------------------------------------------
  news:
    # juhe = 聚合「新闻头条」https://www.juhe.cn/docs/api/id/235
    # tianapi = 天聚「地区新闻」（作主资讯时）https://www.tianapi.com/apiview/154
    # tencent = 腾讯新闻 Skills https://news.qq.com/exchange?scene=appkey
    provider: ${NEWS_PROVIDER:juhe}

  weather:
    # juhe = 聚合「天气预报」https://www.juhe.cn/docs/api/id/73
    # tencent = 腾讯天气 Skills
    provider: ${WEATHER_PROVIDER:juhe}

  # 方案 A：聚合数据 Juhe —— 新闻头条 235 / 天气预报 73
  juhe:
    news:
      enabled: ${JUHE_NEWS_ENABLED:false}
      key: ${JUHE_NEWS_KEY:}
      list-url: ${JUHE_NEWS_LIST_URL:http://v.juhe.cn/toutiao/index}
      content-url: ${JUHE_NEWS_CONTENT_URL:https://v.juhe.cn/toutiao/content}
      type: ${JUHE_NEWS_TYPE:top}
      page-size: ${JUHE_NEWS_PAGE_SIZE:30}
      refresh-seconds: ${JUHE_NEWS_REFRESH_SECONDS:3600}
    # 天气预报 https://www.juhe.cn/docs/api/id/73
    weather:
      enabled: ${JUHE_WEATHER_ENABLED:false}
      key: ${JUHE_WEATHER_KEY:}
      query-url: ${JUHE_WEATHER_QUERY_URL:https://apis.juhe.cn/simpleWeather/query}
      life-url: ${JUHE_WEATHER_LIFE_URL:https://apis.juhe.cn/simpleWeather/life}
      default-adcode: ${JUHE_WEATHER_DEFAULT_ADCODE:654002}
      refresh-seconds: ${JUHE_WEATHER_REFRESH_SECONDS:600}

  # 方案 B：天聚数行 —— 首页「新疆资讯」块固定走此接口；作主资讯时设 NEWS_PROVIDER=tianapi
  tianapi:
    news:
      enabled: ${TIANAPI_NEWS_ENABLED:false}
      key: ${TIANAPI_NEWS_KEY:}
      list-url: ${TIANAPI_NEWS_LIST_URL:https://apis.tianapi.com/areanews/index}
      areaname: ${TIANAPI_NEWS_AREANAME:新疆}
      page-size: ${TIANAPI_NEWS_PAGE_SIZE:20}
      refresh-seconds: ${TIANAPI_NEWS_REFRESH_SECONDS:3600}

  # 方案 C：腾讯新闻 Skills —— https://news.qq.com/exchange?scene=appkey
  # 使用 Tencent 时：NEWS_PROVIDER=tencent，并设 TENCENT_NEWS_ENABLED=true 与 TENCENT_NEWS_KEY
  tencent:
    news:
      enabled: ${TENCENT_NEWS_ENABLED:false}
      key: ${TENCENT_NEWS_KEY:}
      base-url: ${TENCENT_NEWS_BASE_URL:https://openapi.inews.qq.com}
      caller-skill: ${TENCENT_NEWS_CALLER_SKILL:tencent-news}
      page-size: ${TENCENT_NEWS_PAGE_SIZE:20}
      refresh-seconds: ${TENCENT_NEWS_REFRESH_SECONDS:3600}
    weather:
      enabled: ${TENCENT_WEATHER_ENABLED:false}
      key: ${TENCENT_WEATHER_KEY:}
      base-url: ${TENCENT_WEATHER_BASE_URL:https://openapi.inews.qq.com}
      caller-skill: ${TENCENT_WEATHER_CALLER_SKILL:tencent-weather}
      default-adcode: ${TENCENT_WEATHER_DEFAULT_ADCODE:654002}
      refresh-seconds: ${TENCENT_WEATHER_REFRESH_SECONDS:600}

  cos:
    enabled: ${SHUZIYILI_COS_ENABLED:true}
    secret-id: ${SHUZIYILI_COS_SECRET_ID:}
    secret-key: ${SHUZIYILI_COS_SECRET_KEY:}
    region: ${SHUZIYILI_COS_REGION:ap-chengdu}
    bucket: ${SHUZIYILI_COS_BUCKET:shuziyili-1322855353}
    public-base-url: ${SHUZIYILI_COS_PUBLIC_BASE_URL:https://shuziyili-1322855353.cos.ap-chengdu.myqcloud.com}
    key-prefix: ${SHUZIYILI_COS_KEY_PREFIX:uploads/}

springdoc:
  api-docs:
    path: /api/v1/docs/openapi
  swagger-ui:
    path: /api/v1/docs/swagger-ui
