# 本地开发用 MySQL 8（与 application-dev.yml 默认账号一致）
# 用法：在 api/ 目录执行  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shuziyili
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
